name = "otamesi-iju-app"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGIN = "https://czwaew.github.io"
OPENAI_MODEL = "gpt-5-mini"

# Optional Cloudflare KV binding for analytics.
# Create a KV namespace in Cloudflare and then uncomment/configure:
# [[kv_namespaces]]
# binding = "ANALYTICS"
# id = "YOUR_KV_NAMESPACE_ID"

# Keep secrets out of GitHub. Configure these in Cloudflare:
# OPENAI_API_KEY
# ADMIN_TOKEN
